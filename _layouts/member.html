---
layout: page
---
<article class="member-page">
  <p><a href="/people/">&larr; Back to people</a></p>
  <h1>{{ page.name }}</h1>
  <p><strong>{{ page.role }}</strong>{% if page.start_year %} &middot; since {{ page.start_year }}{% endif %}</p>
  {% if page.photo %}<img src="{{ page.photo }}" alt="{{ page.name }}" style="max-width:220px;border-radius:8px;">{% endif %}
  {{ content }}
  {% if page.email %}<p><a href="mailto:{{ page.email }}">{{ page.email }}</a></p>{% endif %}
</article>
